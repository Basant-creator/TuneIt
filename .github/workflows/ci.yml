name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — typecheck, engines, API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Verify engine ↔ frontend contract
        run: npm run verify:engines

      - name: API smoke test
        run: npm run verify:api

      # The landing-page sandbox ships precomputed engine runs
      # (frontend/src/data/sandboxEngineResults.json). Fail if an engine
      # change left them stale: run `npm run generate:sandbox` to refresh.
      - name: Sandbox results match the engines
        run: npm run verify:sandbox

      - name: Build
        run: npm run build

      # Start what was built, exactly as `npm start` does in production. A
      # compiled-but-misplaced server (dist/src/server.js vs dist/server.js)
      # once passed every check above and failed only on deploy.
      - name: Built server starts
        env:
          PORT: '3099'
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:3099/health && exit 0
            sleep 1
          done
          cat server.log
          exit 1

  frontend:
    name: Frontend — lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npx eslint src --max-warnings=0

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & component tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_PUBLIC_APP_URL: https://example.com
